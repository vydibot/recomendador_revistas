name: CI

on:
  pull_request:
  workflow_call:   # lo reutiliza deploy.yml antes de publicar

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: ML (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/pyproject.toml }
      - run: pip install -e "ml[etl,dev]"
      - run: python -m pytest -q
        working-directory: ml

  backend:
    name: Backend (ruff, migraciones, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      # torch CPU: los tests no lo usan, pero es dependencia del paquete.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.14,<2.15"
      - run: pip install -e ml -e "backend[dev]"
      - run: ruff check . && ruff format --check .
        working-directory: backend
      - name: Migraciones y semilla sobre PostgreSQL real
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check          # el esquema de los modelos coincide con las migraciones
          python -m app.cli seed
          python -m app.cli seed # idempotente
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Frontend (tipos, tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Imágenes Docker (build sin publicar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, push: false, cache-from: type=gha,scope=backend, cache-to: "type=gha,scope=backend,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: frontend/Dockerfile, push: false, cache-from: type=gha,scope=frontend, cache-to: "type=gha,scope=frontend,mode=max" }
