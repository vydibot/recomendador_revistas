# Stack completo en local construyendo desde el código fuente (mismas imágenes que producción):
#   docker compose up --build        ->  http://localhost:8080
name: recomendador-dev

services:
  caddy:
    image: caddy:2-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    environment:
      DOMAIN: ":80"          # HTTP plano, sin dominio ni certificado
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://recomendador:dev@db:5432/recomendador
      SECRET_KEY: dev-secret-key-only-for-local-docker-compose-0123456789
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CORS_ORIGINS: "[]"
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recomendador
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: recomendador
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recomendador -d recomendador"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
