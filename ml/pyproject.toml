[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recomendador-revistas"
version = "0.1.0"
description = "Pipeline y modelos para recomendación de revistas científicas"
requires-python = ">=3.12"
# Dependencias mínimas para cargar el modelo y servir recomendaciones (las usa
# el backend). El ETL y el entrenamiento requieren los extras ``etl`` y ``nlp``.
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "pyarrow",
    "unidecode",
]

[project.optional-dependencies]
etl = ["rapidfuzz", "lingua-language-detector", "pypdf", "fonttools"]
nlp = ["transformers", "torch"]
pdf = ["pymupdf", "pillow", "pytesseract"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]